[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-activity-generator"
version = "2.0.0"
description = "Generate GitHub activity graphs by creating backdated commits"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "John Wyles", email = "john@johnwyles.com"}
]
keywords = ["github", "activity", "generator", "commits", "contributions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
requires-python = ">=3.8"
dependencies = [
    "holidays>=0.30",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    "tox>=4.0.0",
    "types-PyYAML>=6.0.0",
    "hypothesis>=6.0.0",
]

[project.scripts]
github-activity-generator = "github_activity_generator.cli:main"

[project.urls]
"Homepage" = "https://github.com/johnwyles/github-activity-generator"
"Bug Reports" = "https://github.com/johnwyles/github-activity-generator/issues"
"Source" = "https://github.com/johnwyles/github-activity-generator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
github_activity_generator = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "S",      # flake8-bandit
    "A",      # flake8-builtins
    "DTZ",    # flake8-datetimez
    "EM",     # flake8-errmsg
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "ARG",    # flake8-unused-arguments
    "PL",     # pylint
    "RUF",    # ruff-specific rules
]
ignore = [
    "S101",   # Use of assert (needed for tests)
    "PLR0913", # Too many arguments
    "S311",   # Standard pseudo-random generators (not crypto use)
    "PLR2004", # Magic values (intentional for behavior patterns)
    "ARG002", # Unused method arguments (required by base class)
    "E501",   # Line too long (handled by Black)
    "C901",   # Function complexity
    "PLR0912", # Too many branches
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "DTZ001", "PLR2004"]
"src/github_activity_generator/behaviors.py" = ["S311", "PLR2004"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=src",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"