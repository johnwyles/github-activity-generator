[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-activity-generator"
version = "2.0.0"
description = "Generate realistic GitHub activity"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "John Wyles", email = "john@johnwyles.com"},
]
keywords = ["github", "activity", "generator", "contributions", "git"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "rich>=13.0",
    "PyYAML>=6.0",
    "holidays>=0.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-PyYAML",
    "hypothesis>=6.0",
]

[project.urls]
Homepage = "https://github.com/johnwyles/github-activity-generator"
Repository = "https://github.com/johnwyles/github-activity-generator.git"
Issues = "https://github.com/johnwyles/github-activity-generator/issues"

[project.scripts]
github-activity-generator = "github_activity_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
^/(
  (
    \.eggs
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.ruff_cache
    | \.venv
    | __pycache__
    | build
    | dist
  )/
)
'''

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PL",     # pylint
    "RUF",    # ruff-specific rules
]
ignore = [
    "S101",   # Use of assert (needed for tests)
    "PLR0913", # Too many arguments
    "S311",   # Standard pseudo-random generators (not crypto use)
    "PLR2004", # Magic values (intentional for behavior patterns)
    "ARG002", # Unused method arguments (required by base class)
    "E501",   # Line too long (handled by Black)
    "C901",   # Function complexity
    "PLR0912", # Too many branches
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S110", "S602", "S607", "DTZ001", "PLR2004", "PLC0415", "SIM105"]
"src/github_activity_generator/behaviors.py" = ["S311", "PLR2004"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "github_activity_generator.behaviors"
allow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=github_activity_generator",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B311", "B404", "B603", "B607"]

[tool.coverage.run]
source_pkgs = ["github_activity_generator"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.paths]
source = [
    "src/github_activity_generator",
    "*/site-packages/github_activity_generator",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "pass",
    "except ImportError:",
]