[tox]
envlist = py{38,39,310,311,312}, lint, type, security
isolated_build = True
skip_missing_interpreters = True

[testenv]
deps =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-mock>=3.11.0
    hypothesis>=6.0.0
commands =
    pytest {posargs:tests} -v --cov --cov-report=term-missing

[testenv:lint]
skip_install = True
deps =
    black>=23.0.0
    ruff>=0.1.0
commands =
    black --check src tests
    ruff check src tests

[testenv:type]
deps =
    mypy>=1.5.0
    types-PyYAML>=6.0.0
commands =
    mypy src tests

[testenv:security]
skip_install = True
deps =
    bandit[toml]>=1.7.0
    safety>=2.3.0
commands =
    bandit -r src
    safety check

[testenv:format]
skip_install = True
deps =
    black>=23.0.0
    ruff>=0.1.0
commands =
    black src tests
    ruff check --fix src tests

[testenv:docs]
deps =
    sphinx>=5.0.0
    sphinx-rtd-theme>=1.2.0
    sphinx-autodoc-typehints>=1.23.0
commands =
    sphinx-build -b html docs docs/_build/html

[testenv:dev]
deps =
    {[testenv]deps}
    {[testenv:lint]deps}
    {[testenv:type]deps}
    ipython>=8.0.0
    ipdb>=0.13.0
commands =
    python -c "print('Development environment ready!')"